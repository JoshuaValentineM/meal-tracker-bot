services:
  - type: web
    name: meal-tracker-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    maxShutdownDelaySeconds: 60
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOT_TRIGGER_ALIASES
        value: Meal Tracker BOT
      - key: TARGET_GROUP_NAME
        value: ""
      - key: WHATSAPP_AUTH_BACKEND
        value: supabase
      - key: WHATSAPP_SESSION_ID
        value: meal-tracker-primary
