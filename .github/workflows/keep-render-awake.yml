name: Keep Render awake

on:
  schedule:
    # Render Free spins down after 15 minutes without inbound traffic. Ten minutes
    # leaves room for occasional GitHub Actions scheduling delays.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_KEEPALIVE_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
        run: |
          if [ -z "$RENDER_KEEPALIVE_URL" ]; then
            echo "Missing RENDER_KEEPALIVE_URL repository secret."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "$RENDER_KEEPALIVE_URL"
